<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RDFZ萌战 2026 - 实时投票</title>

    <!-- 1. 标准 Favicon 图标 (适配桌面端浏览器标签页) -->
    <link rel="icon" href="./favicon.ico" type="image/x-icon">
    <!-- 2. 移动端 iOS / Safari 书签图标 (适配添加到手机主屏幕) -->
    <link rel="apple-touch-icon" href="./favicon.png">
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Vue 3 CDN -->
    <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
    <!-- Socket.IO -->
    <script src="https://cdn.socket.io/4.7.5/socket.io.min.js"></script>
    <!-- Canvas Confetti 特效 -->
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <!-- 引入 FingerprintJS 官方 v4 CDN -->
    <script src="./js/fp.min.js"></script>
    <style>
        [v-cloak] { display: none; }
        .font-anime { font-family: 'PingFang SC', 'Microsoft YaHei', sans-serif; }
        
        /* 1. 移动端与桌面端背景图配置 */
        .page-bg {
            /* 移动端背景图 (凉宫春日) */
            background-image: url('./background_mobile.jpg');
            background-position: center top;
            background-size: cover;
            background-repeat: no-repeat;
        }
        @media (min-width: 768px) {
            .page-bg {
                /* 桌面端/平板背景图 (败犬女主) */
                background-image: url('./background_desktop.jpg');
            }
        }
    </style>
</head>
<body class="page-bg text-slate-100 min-h-screen font-anime antialiased selection:bg-pink-500 selection:text-white relative">

<!-- 全局背景蒙版 -->
<div class="fixed inset-0 bg-slate-950/60 backdrop-brightness-90 pointer-events-none z-0"></div>

<div id="app" v-cloak class="relative z-10 max-w-5xl mx-auto px-4 py-8">

    <!-- 顶部 Header -->
    <header class="text-center mb-6 p-6 rounded-3xl bg-slate-900/40 backdrop-blur-md border border-white/10 shadow-2xl">
        <div class="inline-flex items-center gap-2 px-3 py-1 rounded-full bg-pink-500/20 border border-pink-500/40 text-pink-300 text-xs font-semibold mb-3 backdrop-blur-sm">
            <span class="w-2 h-2 rounded-full bg-pink-400 animate-pulse"></span>
            RDFZ MOE BATTLE 2026
        </div>
        <h1 class="text-3xl md:text-5xl font-extrabold tracking-tight text-transparent bg-clip-text bg-gradient-to-r from-pink-300 via-purple-200 to-indigo-300 drop-shadow mb-4">
            萌战投票系统
        </h1>

        <!-- 顶部 Tab 导航栏：实时投票 vs 历史赛果 -->
        <div class="inline-flex p-1.5 bg-slate-950/60 rounded-2xl border border-white/10 backdrop-blur-md">
            <button 
                @click="switchTab('active')"
                class="px-5 py-2 rounded-xl text-xs md:text-sm font-bold transition-all duration-300 flex items-center gap-1.5"
                :class="activeTab === 'active' ? 'bg-pink-500 text-white shadow-lg shadow-pink-500/30' : 'text-slate-400 hover:text-slate-200'"
            >
                <span class="w-2 h-2 rounded-full" :class="activeMatch ? 'bg-emerald-400 animate-ping' : 'bg-slate-500'"></span>
                进行中赛事
            </button>
            <button 
                @click="switchTab('history')"
                class="px-5 py-2 rounded-xl text-xs md:text-sm font-bold transition-all duration-300 flex items-center gap-1.5"
                :class="activeTab === 'history' ? 'bg-purple-600 text-white shadow-lg shadow-purple-600/30' : 'text-slate-400 hover:text-slate-200'"
            >
                🏆 往期归档
            </button>
        </div>
    </header>

    <!-- 加载中 -->
    <div v-if="loading" class="flex flex-col items-center justify-center py-20 bg-slate-900/40 backdrop-blur-md rounded-3xl border border-white/10 text-slate-300">
        <div class="w-10 h-10 border-4 border-pink-500 border-t-transparent rounded-full animate-spin mb-4"></div>
        <p>正在读取数据...</p>
    </div>

    <!-- ==================== TAB 1: 进行中赛事 ==================== -->
    <template v-else-if="activeTab === 'active'">
        <!-- 无进行中比赛 -->
        <div v-if="activeMatches.length === 0" class="text-center py-20 bg-slate-900/40 backdrop-blur-md rounded-3xl border border-white/10 max-w-lg mx-auto shadow-2xl">
            <div class="text-5xl mb-4">☕</div>
            <h3 class="text-xl font-bold text-slate-100">当前暂无进行中的赛程</h3>
            <p class="text-slate-300/70 text-sm mt-2 mb-6">下一轮对决正在筹备中，可切换至上方“往期归档”查看历史赛况</p>
            <button @click="switchTab('history')" class="px-5 py-2.5 bg-purple-600 hover:bg-purple-700 text-white font-bold text-sm rounded-xl transition">
                查看往期赛果
            </button>
        </div>

        <!-- 有进行中比赛：纵向堆叠多场比赛卡片 -->
        <main v-else class="space-y-12 pb-16">
            <section 
                v-for="match in activeMatches" 
                :key="match.id" 
                class="p-4 md:p-6 rounded-3xl bg-slate-900/30 backdrop-blur-md border border-white/10 shadow-2xl"
            >
                <!-- 比赛标题提示栏 -->
                <div class="mb-6 p-4 rounded-2xl bg-slate-900/50 backdrop-blur-md border border-white/10 flex flex-col md:flex-row items-center justify-between gap-2 shadow-lg">
                    <div class="font-bold text-slate-100 text-base md:text-lg flex items-center gap-2">
                        <span class="px-2.5 py-0.5 rounded-lg bg-pink-500/20 text-pink-300 text-xs font-black border border-pink-500/30">
                            {{ match.match_type === 'group' ? '小组赛' : '1v1 淘汰赛' }}
                        </span>
                        {{ match.title }}
                    </div>
                    <div v-if="match.match_type === 'group'" class="text-xs text-slate-300/80">
                        本设备进度：<span class="text-pink-400 font-bold text-sm">{{ match.myVotedCharacterIds.length }}</span> / {{ getMatchMaxVotes(match) }} 票
                    </div>
                </div>

                <!-- 1. 小组赛网格 -->
                <div v-if="match.match_type === 'group'">
                    <div class="grid grid-cols-2 sm:grid-cols-3 lg:grid-cols-4 gap-4 md:gap-6 mb-6">
                        <div 
                            v-for="(item, index) in getSortedCandidates(match.candidates)" 
                            :key="item.character_id"
                            @click="toggleSelection(match.id, item.character_id)"
                            class="group relative bg-slate-900/40 backdrop-blur-md rounded-2xl border transition-all duration-300 hover:-translate-y-1 hover:shadow-2xl flex flex-col p-3.5 overflow-hidden cursor-pointer"
                            :class="[
                                (selectedMap[match.id] || []).includes(item.character_id)
                                    ? 'border-pink-500/90 bg-pink-500/10 shadow-pink-500/20'
                                    : 'border-white/10 hover:border-pink-500/40 hover:bg-slate-900/60'
                            ]"
                        >
                            <div 
                                v-if="(selectedMap[match.id] || []).includes(item.character_id)" 
                                class="absolute top-3 right-3 z-20 w-6 h-6 rounded-full bg-pink-500 text-white font-black text-xs flex items-center justify-center shadow-lg"
                            >✓</div>

                            <div class="absolute top-5 left-5 z-10 px-2 py-0.5 rounded-md text-xs font-black shadow-lg backdrop-blur-md"
                                :class="{
                                    'bg-yellow-400/90 text-slate-950': index === 0,
                                    'bg-slate-200/90 text-slate-950': index === 1,
                                    'bg-amber-600/90 text-white': index === 2,
                                    'bg-slate-900/80 text-slate-300 border border-white/10': index > 2
                                }">
                                NO.{{ index + 1 }}
                            </div>

                            <div class="relative w-full overflow-hidden bg-slate-950/60 rounded-xl border border-white/10 min-h-[160px] flex items-center justify-center">
                                <img :src="item.characters.avatar_url" :alt="item.characters.name" class="w-full h-auto block group-hover:scale-105 transition-transform duration-500 object-contain" loading="lazy" />
                            </div>

                            <div class="mt-auto pt-3.5 flex flex-col text-center">
                                <div class="h-11 flex items-center justify-center px-1">
                                    <h3 class="font-bold text-sm md:text-base text-slate-100 leading-snug line-clamp-2 drop-shadow">{{ item.characters.name }}</h3>
                                </div>
                                <div class="h-9 flex items-baseline justify-center gap-0.5 my-1">
                                    <span class="text-2xl md:text-3xl font-black text-pink-400 tracking-tight leading-none drop-shadow">{{ item.votes }}</span>
                                    <span class="text-xs text-slate-300/70 font-normal">票</span>
                                </div>

                                <button 
                                    type="button"
                                    :disabled="match.myVotedCharacterIds.includes(item.character_id)"
                                    class="w-full py-2.5 px-4 font-semibold rounded-xl transition shadow-lg text-sm"
                                    :class="[
                                        match.myVotedCharacterIds.includes(item.character_id)
                                            ? 'bg-slate-800/80 text-slate-400 border border-white/5 cursor-not-allowed shadow-none'
                                            : (selectedMap[match.id] || []).includes(item.character_id)
                                                ? 'bg-pink-500 text-white shadow-pink-500/30'
                                                : 'bg-slate-800/80 text-slate-200 border border-white/10 hover:bg-pink-500/20 hover:text-pink-300'
                                    ]"
                                >
                                    <span v-if="match.myVotedCharacterIds.includes(item.character_id)">已应援 ✓</span>
                                    <span v-else-if="(selectedMap[match.id] || []).includes(item.character_id)">已选择 ✓</span>
                                    <span v-else>选择Ta</span>
                                </button>
                            </div>
                        </div>
                    </div>

                    <!-- 小组赛卡片底部的独立提交栏 -->
                    <div 
                        v-if="match.myVotedCharacterIds.length < getMatchMaxVotes(match)" 
                        class="flex flex-col sm:flex-row items-center justify-between gap-4 p-4 rounded-2xl bg-slate-950/70 border border-pink-500/30"
                    >
                        <div class="text-xs md:text-sm pl-1">
                            <span class="text-slate-300">本场拟投：已选 </span>
                            <span class="text-pink-400 font-bold text-base">{{ (selectedMap[match.id] || []).length }}</span>
                            <span class="text-slate-400 text-xs ml-1">/ 还可选 {{ Math.max(0, getMatchMaxVotes(match) - match.myVotedCharacterIds.length - (selectedMap[match.id] || []).length) }} 个</span>
                        </div>
                        <button 
                            @click="submitGroupVotes(match.id)"
                            :disabled="submitting || (selectedMap[match.id] || []).length === 0"
                            class="w-full sm:w-auto px-6 py-2.5 bg-gradient-to-r from-pink-500 to-purple-600 hover:from-pink-600 hover:to-purple-700 disabled:opacity-40 text-white font-bold rounded-xl transition shadow-lg shadow-pink-500/20 text-sm whitespace-nowrap"
                        >
                            确认提交本场选票 ({{ (selectedMap[match.id] || []).length }}票)
                        </button>
                    </div>
                </div>

                <!-- 2. 1v1 PK 赛 -->
                <div v-else-if="match.match_type === 'pk' && match.candidates.length >= 2" class="max-w-3xl mx-auto">
                    <div class="grid grid-cols-2 gap-4 md:gap-8 items-stretch">
                        <!-- 左选手 -->
                        <div class="group bg-slate-900/40 backdrop-blur-md rounded-2xl p-4 md:p-5 border-2 border-pink-500/40 hover:border-pink-500 transition-all duration-300 flex flex-col relative overflow-hidden shadow-2xl shadow-pink-500/10">
                            <div class="absolute top-6 left-6 z-10 px-2 py-0.5 rounded-md text-[10px] md:text-xs font-black bg-pink-500/90 text-white shadow-md">LEFT</div>
                            <div class="relative w-full overflow-hidden bg-slate-950/60 rounded-xl border border-pink-500/30 min-h-[160px] flex items-center justify-center">
                                <img :src="match.candidates[0].characters.avatar_url" class="w-full h-auto block group-hover:scale-105 transition-transform duration-500 object-contain" />
                            </div>
                            <div class="mt-auto pt-3.5 flex flex-col text-center">
                                <div class="h-11 flex items-center justify-center px-1"><h3 class="font-bold text-base md:text-xl text-slate-100 line-clamp-2 drop-shadow">{{ match.candidates[0].characters.name }}</h3></div>
                                <div class="h-10 flex items-baseline justify-center gap-0.5 my-1"><span class="text-3xl md:text-4xl font-black text-pink-400 leading-none drop-shadow">{{ match.candidates[0].votes }}</span><span class="text-xs text-slate-300/70">票</span></div>
                                <button @click="handleVote(match.id, match.candidates[0].character_id)" :disabled="submitting || match.myVotedCharacterIds.includes(match.candidates[0].character_id)" class="w-full py-3 bg-gradient-to-r from-pink-500/90 to-rose-600/90 text-white font-bold rounded-xl transition shadow-lg shadow-pink-500/25 text-sm md:text-base disabled:opacity-50">
                                    {{ match.myVotedCharacterIds.includes(match.candidates[0].character_id) ? '已应援 ✓' : '为Ta应援' }}
                                </button>
                            </div>
                        </div>
                        <!-- 右选手 -->
                        <div class="group bg-slate-900/40 backdrop-blur-md rounded-2xl p-4 md:p-5 border-2 border-indigo-500/40 hover:border-indigo-500 transition-all duration-300 flex flex-col relative overflow-hidden shadow-2xl shadow-indigo-500/10">
                            <div class="absolute top-6 right-6 z-10 px-2 py-0.5 rounded-md text-[10px] md:text-xs font-black bg-indigo-500/90 text-white shadow-md">RIGHT</div>
                            <div class="relative w-full overflow-hidden bg-slate-950/60 rounded-xl border border-indigo-500/30 min-h-[160px] flex items-center justify-center">
                                <img :src="match.candidates[1].characters.avatar_url" class="w-full h-auto block group-hover:scale-105 transition-transform duration-500 object-contain" />
                            </div>
                            <div class="mt-auto pt-3.5 flex flex-col text-center">
                                <div class="h-11 flex items-center justify-center px-1"><h3 class="font-bold text-base md:text-xl text-slate-100 line-clamp-2 drop-shadow">{{ match.candidates[1].characters.name }}</h3></div>
                                <div class="h-10 flex items-baseline justify-center gap-0.5 my-1"><span class="text-3xl md:text-4xl font-black text-indigo-400 leading-none drop-shadow">{{ match.candidates[1].votes }}</span><span class="text-xs text-slate-300/70">票</span></div>
                                <button @click="handleVote(match.id, match.candidates[1].character_id)" :disabled="submitting || match.myVotedCharacterIds.includes(match.candidates[1].character_id)" class="w-full py-3 bg-gradient-to-r from-indigo-500/90 to-purple-600/90 text-white font-bold rounded-xl transition shadow-lg shadow-indigo-500/25 text-sm md:text-base disabled:opacity-50">
                                    {{ match.myVotedCharacterIds.includes(match.candidates[1].character_id) ? '已应援 ✓' : '为Ta应援' }}
                                </button>
                            </div>
                        </div>
                    </div>

                    <!-- 拔河进度条 -->
                    <div class="mt-8 md:mt-10 max-w-4xl mx-auto bg-slate-900/40 backdrop-blur-md p-5 md:p-6 rounded-2xl border border-white/10 shadow-2xl">
                        <div class="flex items-center justify-between text-xs md:text-sm font-bold mb-3 px-1">
                            <div class="text-pink-400 flex items-center gap-1.5 truncate max-w-[35%]">
                                <span class="w-2.5 h-2.5 rounded-full bg-pink-500 animate-pulse shrink-0"></span>
                                <span class="truncate">{{ match.candidates[0].characters.name }}</span>
                                <span class="text-pink-300 font-black ml-1 text-sm md:text-base">{{ getPkPercentages(match).left }}%</span>
                            </div>
                            <div class="text-indigo-400 flex items-center justify-end gap-1.5 truncate max-w-[35%]">
                                <span class="text-indigo-300 font-black mr-1 text-sm md:text-base">{{ getPkPercentages(match).right }}%</span>
                                <span class="truncate">{{ match.candidates[1].characters.name }}</span>
                                <span class="w-2.5 h-2.5 rounded-full bg-indigo-500 animate-pulse shrink-0"></span>
                            </div>
                        </div>

                        <div class="h-6 w-full bg-slate-950/80 rounded-full overflow-hidden flex p-1 border border-white/10 shadow-inner">
                            <div 
                                class="h-full bg-gradient-to-r from-pink-500 via-rose-500 to-pink-400 rounded-full transition-all duration-500 ease-out shadow-md shadow-pink-500/30 flex items-center justify-end pr-2" 
                                :style="{ width: getPkPercentages(match).left + '%' }"
                            >
                                <span v-if="getPkPercentages(match).left >= 12" class="text-[10px] font-black text-white drop-shadow">{{ getPkPercentages(match).left }}%</span>
                            </div>
                            <div 
                                class="h-full bg-gradient-to-r from-indigo-400 via-indigo-500 to-purple-600 rounded-full transition-all duration-500 ease-out shadow-md shadow-indigo-500/30 flex items-center justify-start pl-2" 
                                :style="{ width: getPkPercentages(match).right + '%' }"
                            >
                                <span v-if="getPkPercentages(match).right >= 12" class="text-[10px] font-black text-white drop-shadow">{{ getPkPercentages(match).right }}%</span>
                            </div>
                        </div>
                    </div>
                </div>
            </section>
        </main>
    </template>

    <!-- ==================== TAB 2: 历史赛果归档 ==================== -->
    <template v-else-if="activeTab === 'history'">
        <div v-if="finishedMatches.length > 0" class="mb-6 p-4 rounded-2xl bg-slate-900/40 backdrop-blur-md border border-white/10 shadow-lg flex flex-col md:flex-row items-center justify-between gap-4">
            <div class="text-sm font-bold text-slate-200">选择往期赛程：</div>
            <select 
                v-model="selectedHistoryMatchId" 
                @change="onHistoryMatchChange"
                class="w-full md:w-auto px-4 py-2 bg-slate-950/80 text-pink-300 font-bold border border-white/20 rounded-xl focus:outline-none focus:border-pink-500 text-sm"
            >
                <option v-for="m in finishedMatches" :key="m.id" :value="m.id">
                    [{{ m.match_type === 'group' ? '小组赛' : 'PK赛' }}] {{ m.title }}
                </option>
            </select>
        </div>

        <div v-if="!selectedHistoryMatch" class="text-center py-20 bg-slate-900/40 backdrop-blur-md rounded-3xl border border-white/10 max-w-lg mx-auto shadow-2xl">
            <div class="text-5xl mb-4">📜</div>
            <h3 class="text-xl font-bold text-slate-100">暂无已结算的历史赛程</h3>
            <p class="text-slate-300/70 text-sm mt-2">管理员在后台结算赛程后，结果将在此显示</p>
        </div>

        <main v-else>
            <div class="mb-6 p-4 rounded-2xl bg-slate-900/40 backdrop-blur-md border border-white/10 flex items-center justify-between shadow-lg">
                <div class="font-bold text-slate-100 text-base md:text-lg flex items-center gap-2">
                    <span class="px-2.5 py-0.5 rounded-lg bg-slate-800 text-slate-300 text-xs font-black border border-white/10">
                        比赛已结束
                    </span>
                    {{ selectedHistoryMatch.title }}
                </div>
            </div>

            <div class="grid grid-cols-2 sm:grid-cols-3 lg:grid-cols-4 gap-4 md:gap-6">
                <div 
                    v-for="(item, index) in sortedHistoryCandidates" 
                    :key="item.character_id"
                    class="relative bg-slate-900/40 backdrop-blur-md rounded-2xl border border-white/10 flex flex-col p-3.5 overflow-hidden"
                    :class="{ 'border-yellow-500/50 bg-yellow-500/5': index === 0 }"
                >
                    <div 
                        class="absolute top-5 left-5 z-10 px-2 py-0.5 rounded-md text-xs font-black shadow-lg backdrop-blur-md"
                        :class="{
                            'bg-yellow-400 text-slate-950': index === 0,
                            'bg-slate-200 text-slate-950': index === 1,
                            'bg-amber-600 text-white': index === 2,
                            'bg-slate-800 text-slate-400 border border-white/10': index > 2
                        }"
                    >
                        {{ index === 0 ? '🏆 冠军/头名' : `第 ${index + 1} 名` }}
                    </div>

                    <div class="relative w-full overflow-hidden bg-slate-950/60 rounded-xl border border-white/10 min-h-[160px] flex items-center justify-center">
                        <img :src="item.characters.avatar_url" class="w-full h-auto block object-contain" />
                    </div>

                    <div class="mt-auto pt-3.5 flex flex-col text-center">
                        <div class="h-11 flex items-center justify-center px-1">
                            <h3 class="font-bold text-sm md:text-base text-slate-100 leading-snug line-clamp-2 drop-shadow">
                                {{ item.characters.name }}
                            </h3>
                        </div>

                        <div class="h-9 flex items-baseline justify-center gap-0.5 my-1">
                            <span class="text-2xl md:text-3xl font-black text-pink-400 tracking-tight leading-none drop-shadow">
                                {{ item.votes }}
                            </span>
                            <span class="text-xs text-slate-300/70 font-normal">票</span>
                        </div>

                        <div 
                            class="w-full py-2 px-3 rounded-xl text-xs font-bold text-center border"
                            :class="[
                                historyMyVotedIds.includes(item.character_id)
                                    ? 'bg-pink-500/20 text-pink-300 border-pink-500/40'
                                    : 'bg-slate-800/60 text-slate-400 border-white/5'
                            ]"
                        >
                            {{ historyMyVotedIds.includes(item.character_id) ? '历史为你所投 ✓' : '比赛已结束' }}
                        </div>
                    </div>
                </div>
            </div>
        </main>
    </template>

    <!-- 页脚 -->
    <footer class="mt-16 text-center text-xs text-slate-400/80 border-t border-white/10 pt-6">
        Powered by Vue 3, Socket.IO & Node.js ｜ © 2026 RDFZ冻鳗社·萌战筹备组. All rights reserved. 
    </footer>

</div>

<script>
    const API_BASE_URL = 'http://localhost:3000'; // 部署到生产环境后替换为你的域名，如 'https://api.yourdomain.com'
    const { createApp, ref, computed, onMounted, onUnmounted } = Vue;

    createApp({
        setup() {
            const socket = io(API_BASE_URL);
            const loading = ref(true);
            const submitting = ref(false);
            const visitorId = ref('');
            
            // Tab 状态: 'active' | 'history'
            const activeTab = ref('active');

            // 🌟 1. 进行中的多场比赛数据与各场次本地多选 Map
            const activeMatches = ref([]);
            const selectedMap = ref({}); // 结构: { [matchId]: [charId1, charId2, ...] }

            // 2. 历史比赛的数据
            const finishedMatches = ref([]);
            const selectedHistoryMatchId = ref(null);
            const historyCandidates = ref([]);
            const historyMyVotedIds = ref([]);

            // 3. 硬件指纹提取与降级生成
            const initFingerprint = async () => {
                try {
                    const fp = await FingerprintJS.load();
                    const result = await fp.get();
                    visitorId.value = result.visitorId;
                } catch (e) {
                    let fallbackId = localStorage.getItem('fp_fallback_uuid');
                    if (!fallbackId) {
                        fallbackId = crypto.randomUUID();
                        localStorage.setItem('fp_fallback_uuid', fallbackId);
                    }
                    visitorId.value = fallbackId;
                }
            };

            // 🌟 4. 拉取所有正在进行中的比赛
            const fetchActiveMatch = async () => {
                loading.value = true;
                try {
                    await initFingerprint();
                    const res = await fetch(`${API_BASE_URL}/api/matches/active?visitorId=${visitorId.value}`);
                    const data = await res.json();
                    activeMatches.value = data.matches || [];
                    setupRealtimeSubscription();
                } catch (err) {
                    console.error('加载进行中赛事失败:', err);
                } finally {
                    loading.value = false;
                }
            };

            // 5. 获取往期归档赛事列表
            const fetchFinishedMatches = async () => {
                loading.value = true;
                try {
                    const res = await fetch(`${API_BASE_URL}/api/matches/history`);
                    const data = await res.json();

                    finishedMatches.value = data.matches || [];

                    if (finishedMatches.value.length > 0) {
                        selectedHistoryMatchId.value = finishedMatches.value[0].id;
                        await loadHistoryMatchDetails(selectedHistoryMatchId.value);
                    }
                } catch (err) {
                    console.error('加载历史赛果失败:', err);
                } finally {
                    loading.value = false;
                }
            };

            // 6. 获取特定归档赛事的详细得票与已投选手
            const loadHistoryMatchDetails = async (matchId) => {
                if (!matchId) return;
                try {
                    const res = await fetch(`${API_BASE_URL}/api/matches/history/${matchId}?visitorId=${visitorId.value}`);
                    const data = await res.json();

                    historyCandidates.value = data.candidates || [];
                    historyMyVotedIds.value = data.historyMyVotedIds || [];
                } catch (err) {
                    console.error('加载历史详情失败:', err);
                }
            };

            // 7. 切换 Tab 触发
            const switchTab = async (tab) => {
                activeTab.value = tab;
                if (tab === 'history' && finishedMatches.value.length === 0) {
                    await fetchFinishedMatches();
                } else if (tab === 'active' && activeMatches.value.length === 0) {
                    await fetchActiveMatch();
                }
            };

            // 8. 下拉框切换历史比赛触发
            const onHistoryMatchChange = () => {
                loadHistoryMatchDetails(selectedHistoryMatchId.value);
            };

            // 🌟 9. 计算与视图辅助函数
            const getSortedCandidates = (cands) => [...(cands || [])].sort((a, b) => b.votes - a.votes);
            const getMatchMaxVotes = (match) => match.match_type === 'group' ? 2 : 1;
            const getPkPercentages = (match) => {
                if (!match.candidates || match.candidates.length < 2) return { left: 50, right: 50 };
                const v1 = match.candidates[0].votes || 0;
                const v2 = match.candidates[1].votes || 0;
                const total = v1 + v2;
                if (total === 0) return { left: 50, right: 50 };
                const left = Math.round((v1 / total) * 100);
                return { left, right: 100 - left };
            };

            // 10. 历史归档计算属性
            const selectedHistoryMatch = computed(() => finishedMatches.value.find(m => m.id === selectedHistoryMatchId.value));
            const sortedHistoryCandidates = computed(() => [...historyCandidates.value].sort((a, b) => b.votes - a.votes));

            // 🌟 11. Socket.IO 实时事件监听（支持多场次精准更新）
            const setupRealtimeSubscription = () => {
                socket.off('vote_update');
                socket.on('vote_update', (data) => {
                    const targetMatch = activeMatches.value.find(m => m.id === data.matchId);
                    if (targetMatch) {
                        const item = targetMatch.candidates.find(c => c.character_id === data.characterId);
                        if (item) {
                            item.votes = data.newVotes;
                        }
                    }
                });
                socket.off('match_status_changed');
                socket.on('match_status_changed', () => {
                    fetchActiveMatch();
                });
            };

            // 🌟 12. 小组赛本地选择/取消选择逻辑（按 matchId 隔离存储）
            const toggleSelection = (matchId, characterId) => {
                const targetMatch = activeMatches.value.find(m => m.id === matchId);
                if (!targetMatch || targetMatch.myVotedCharacterIds.includes(characterId)) return;

                if (!selectedMap.value[matchId]) selectedMap.value[matchId] = [];
                const list = selectedMap.value[matchId];
                const index = list.indexOf(characterId);
                if (index > -1) {
                    list.splice(index, 1);
                } else {
                    const maxV = getMatchMaxVotes(targetMatch);
                    const remaining = maxV - targetMatch.myVotedCharacterIds.length;
                    if (list.length < remaining) {
                        list.push(characterId);
                    } else {
                        alert(`本场比赛每人最多可投 ${maxV} 票，您当前最多还能勾选 ${remaining} 个角色`);
                    }
                }
            };

            // 🌟 13. 1v1 PK 赛单次投票应援
            const handleVote = async (matchId, characterId) => {
                const targetMatch = activeMatches.value.find(m => m.id === matchId);
                if (!targetMatch || !visitorId.value) return;
                submitting.value = true;
                try {
                    const res = await fetch(`${API_BASE_URL}/api/vote`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({
                            matchId: matchId,
                            characterId: characterId,
                            visitorId: visitorId.value
                        })
                    });

                    const data = await res.json();

                    if (data.success) {
                        targetMatch.myVotedCharacterIds.push(characterId);
                        confetti({ particleCount: 80, spread: 60, origin: { y: 0.8 } });
                        alert('🎉 ' + data.message);
                    } else {
                        alert('⚠️ ' + data.message);
                    }
                } catch (err) {
                    alert('投票异常: ' + (err.message || '网络连接失败'));
                } finally {
                    submitting.value = false;
                }
            };

            // 🌟 14. 小组赛统一提交本场选票
            const submitGroupVotes = async (matchId) => {
                const targetMatch = activeMatches.value.find(m => m.id === matchId);
                const targets = [...(selectedMap.value[matchId] || [])];
                if (!targetMatch || targets.length === 0 || !visitorId.value) return;
                submitting.value = true;

                try {
                    let successCount = 0;
                    const errorMessages = [];

                    for (const charId of targets) {
                        const res = await fetch(`${API_BASE_URL}/api/vote`, {
                            method: 'POST',
                            headers: { 'Content-Type': 'application/json' },
                            body: JSON.stringify({
                                matchId: matchId,
                                characterId: charId,
                                visitorId: visitorId.value
                            })
                        });

                        const data = await res.json();

                        if (data.success) {
                            targetMatch.myVotedCharacterIds.push(charId);
                            selectedMap.value[matchId] = selectedMap.value[matchId].filter(id => id !== charId);
                            successCount++;
                        } else {
                            if (!errorMessages.includes(data.message)) {
                                errorMessages.push(data.message);
                            }
                            selectedMap.value[matchId] = selectedMap.value[matchId].filter(id => id !== charId);
                        }
                    }

                    if (successCount > 0) {
                        confetti({ particleCount: 100, spread: 70, origin: { y: 0.8 } });
                        if (errorMessages.length > 0) {
                            alert(`🎉 成功投出 ${successCount} 张选票！\n⚠️ 部分角色未投出：${errorMessages.join('；')}`);
                        } else {
                            alert(`🎉 成功投出 ${successCount} 张选票！`);
                        }
                    } else if (errorMessages.length > 0) {
                        alert(`⚠️ 投票未能成功：\n${errorMessages.join('\n')}`);
                    }

                } catch (err) {
                    alert('投票请求异常: ' + (err.message || '网络连接异常'));
                } finally {
                    submitting.value = false;
                }
            };

            onMounted(() => {
                fetchActiveMatch();
            });

            onUnmounted(() => {
                socket.disconnect();
            });

            return {
                loading,
                submitting,
                activeTab,
                visitorId,
                activeMatches,
                selectedMap,
                finishedMatches,
                selectedHistoryMatchId,
                selectedHistoryMatch,
                sortedHistoryCandidates,
                historyMyVotedIds,
                switchTab,
                onHistoryMatchChange,
                getSortedCandidates,
                getMatchMaxVotes,
                getPkPercentages,
                toggleSelection,
                handleVote,
                submitGroupVotes,
                fetchActiveMatch
            };
        }
    }).mount('#app');
</script>
</body>
</html>
